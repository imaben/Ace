[package]
name = "ace-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ace application binary"
default-run = "ace"

[[bin]]
name = "ace"
path = "src/main.rs"

[dependencies]
ace-bundle = { workspace = true }
ace-core = { workspace = true }
ace-driver = { workspace = true }
ace-io = { workspace = true }
ace-mcp = { workspace = true }
ace-mysql = { workspace = true }
ace-net = { workspace = true }
ace-postgres = { workspace = true }
ace-sql = { workspace = true }
ace-sqlite = { workspace = true }
ace-store = { workspace = true }
ace-ui = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[features]
default = []
