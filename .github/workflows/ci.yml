name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libfreetype-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libwayland-dev \
            libvulkan-dev \
            libssl-dev \
            cmake
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        # The existing tree is not uniformly rustfmt-clean. Keep this visible
        # in CI, but do not fail the job until a dedicated formatting pass
        # is agreed. Format files you touch; do not reformat the whole tree
        # in unrelated pull requests.
        run: cargo fmt --all -- --check
        continue-on-error: true
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace --all-features
      - name: Clippy
        # Deny new warnings, but allow lints already present in the tree so
        # phase-1 CI can gate quality without a full-repo style cleanup.
        run: >
          cargo clippy --workspace --all-targets -- -D warnings
          -A clippy::field_reassign_with_default
          -A clippy::too_many_arguments
          -A clippy::large_enum_variant
          -A clippy::derivable_impls
          -A clippy::redundant_closure
          -A clippy::len_without_is_empty
          -A clippy::type_complexity
          -A clippy::if_same_then_else
          -A clippy::new_without_default

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ace_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libfreetype-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libwayland-dev \
            libvulkan-dev \
            libssl-dev \
            cmake
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ace-app
      - name: Smoke query
        run: |
          cargo run -p ace-app -- query 'mysql://root:root@127.0.0.1:3306/ace_test' 'SELECT 1 AS ok'
