name: Bug report
description: Report a problem in the current Ace tree
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include database passwords, connection strings, private keys, tokens, or raw `credentials.json` / `favorites.json` contents.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: A short description of the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from launching Ace or a CLI command. Redact secrets.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - Not sure / other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ace version
      description: Output of `ace info`, a git commit, or "built from source at <commit>".
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Database engine (if relevant)
      options:
        - MySQL
        - MariaDB
        - PostgreSQL
        - SQLite
        - Not applicable
  - type: textarea
    id: logs
    attributes:
      label: Logs or errors
      description: Paste relevant logs after redacting hosts, usernames, and secrets.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for a similar report.
          required: true
        - label: This report does not contain production credentials or private connection details.
          required: true
